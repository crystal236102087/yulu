<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>余录 · 读书摘录</title>
  <!-- PWA / 移动端应用图标（龙藏体，与页面字体一致） -->
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f7f2e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="余录">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 书法主字体：龙藏 Long Cang（飘逸行书，jsdelivr CDN） -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/long-cang/index.css" rel="stylesheet">
  <!-- 毛笔楷书：马善政 Ma Shan Zheng（品牌大字专用，浓墨毛笔质感） -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng/index.css" rel="stylesheet">
  <!-- 兜底书法体 + 正文宋体（走 jsdelivr CDN，比 Google Fonts 更稳、国内可达） -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/zhi-mang-xing/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/600.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/700.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/900.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f7f2e6',
            card: '#fffdf8',
            ink: '#2a2622',
            inklight: '#7c7368',
            cinnabar: '#a63a2b',
            indigoblue: '#3a5666',
            bamboo: '#72855f',
            gold: '#9c7c35',
            line: '#e3d9c4',
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'Songti SC', 'SimSun', 'serif'],
            brush: ['"Long Cang"', '"Zhi Mang Xing"', '"Ma Shan Zheng"', 'cursive'],
          },
          boxShadow: {
            'paper': '0 1px 3px rgba(42,38,34,0.05), 0 6px 18px rgba(42,38,34,0.06)',
            'card': '0 2px 6px rgba(42,38,34,0.06), 0 12px 28px rgba(42,38,34,0.09)',
            'float': '0 10px 32px rgba(166,58,43,0.32)',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif; }
    /* 宣纸纤维纹理 */
    .texture-bg {
      background-color: #f7f2e6;
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(156,124,53,0.045) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 80%, rgba(58,86,102,0.04) 0%, transparent 55%),
        repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(42,38,34,0.012) 3px, rgba(42,38,34,0.012) 4px),
        repeating-linear-gradient(90deg, transparent 0, transparent 3px, rgba(42,38,34,0.012) 3px, rgba(42,38,34,0.012) 4px);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn 0.4s ease both; }
    .fade-in:nth-child(2) { animation-delay: .06s; }
    .fade-in:nth-child(3) { animation-delay: .12s; }
    .fade-in:nth-child(4) { animation-delay: .18s; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
    .slide-up { animation: slideUp 0.32s cubic-bezier(0.32,0.72,0,1) both; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
    /* 笺纸卡片：双线边框 + 角部装饰 */
    .letter-card {
      position: relative;
      background: linear-gradient(135deg, #fffdf6 0%, #faf5e9 100%);
      border: 1px solid #e8dfc9;
      outline: 1px solid rgba(166,58,43,0.12);
      outline-offset: -5px;
      box-shadow: 0 1px 3px rgba(42,38,34,0.05), 0 6px 18px rgba(42,38,34,0.06);
    }
    .corner-deco { position:absolute; width:14px; height:14px; border-color: rgba(166,58,43,0.4); }
    .v-text { writing-mode: vertical-rl; letter-spacing: 0.28em; }
    /* 书脊立体感 */
    .book-spine {
      border-radius: 3px 6px 6px 3px;
      box-shadow: inset 4px 0 6px -3px rgba(0,0,0,0.35), inset -2px 0 3px -1px rgba(255,255,255,0.25), 2px 3px 8px rgba(42,38,34,0.25);
      position: relative;
      overflow: hidden;
    }
    .book-spine::before { /* 书脊装订线 */
      content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px;
      background: rgba(255,255,255,0.28);
    }
    .book-spine::after { /* 烫金线 */
      content: ''; position: absolute; left: 9px; top: 8%; bottom: 8%; width: 1px;
      background: rgba(255,255,255,0.16);
    }
    /* 仿真实书籍封面（书架页用）：3:4 矩形，书名居中，顶部光 + 底部阴影 */
    .book-cover {
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 4px 10px rgba(42,38,34,0.28);
    }
    .book-cover::before { /* 顶部柔光 */
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 46%;
      background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
    }
    .book-cover::after { /* 书脊细节：左缘一条竖高光 + 折痕 */
      content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px;
      background: rgba(255,255,255,0.28);
    }
    .book-cover .cover-inner {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 8px 6px; text-align: center;
    }
    /* ===== 统一封面设计系统（照搬参考图第四版：精装布面书）=====
       版式：布面底色(细颗粒纹理) → 左侧深色书脊 → 圆角双线框(底部留口)
             → 框内顶部方形印章 + 右上装饰方点 → 书名(竖排/横排) + 作者
             → 右下角云纹 → 框内底部米色信息名牌 */
    .cv-cloth {           /* 布面细颗粒（极密交叉斜纹 + 网点模拟织物） */
      background-image:
        repeating-linear-gradient(38deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 2.5px),
        repeating-linear-gradient(-52deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 3px),
        radial-gradient(circle at 1px 1px, rgba(0,0,0,0.055) 0.55px, transparent 0.65px);
      background-size: auto, auto, 3px 3px;
    }
    .cv-line {            /* 外框：圆角双线框（参考图外侧粗线） */
      position: absolute; left: 8.5%; right: 8.5%; top: 4.5%; bottom: 9%;
      border: 1.5px solid rgba(255,255,255,0.62);
      border-bottom: 0;
      border-radius: 3px 3px 0 0;
      pointer-events: none;
    }
    .cv-line::before {    /* 第二道细内线（参考图内细线） */
      content: ''; position: absolute; left: 3.5px; right: 3.5px; top: 3.5px; bottom: 0;
      border: 0.8px solid rgba(255,255,255,0.40);
      border-bottom: 0;
      border-radius: 2px 2px 0 0;
    }
    .cv-seal {            /* 框内顶部居中方形印章（描边 + 单字） */
      position: absolute; left: 50%; transform: translateX(-50%); top: 8%;
      width: 19cqw; height: 19cqw; max-width: 24px; max-height: 24px;
      border-radius: 1.5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9cqw; font-weight: 700; line-height: 1;
      letter-spacing: 0; z-index: 4;
      background: rgba(255,255,255,0.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.30);
    }
    .cv-dot {             /* 右上角装饰小方点 */
      position: absolute; top: 8.5%; width: 5.5cqw; height: 5.5cqw;
      max-width: 7px; max-height: 7px;
      border-radius: 1px; z-index: 4;
      background: rgba(122,60,48,0.55);
    }
    .cv-name {            /* 书名：书法楷意（衬线重字重） */
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      font-weight: 900; letter-spacing: 0.06em; line-height: 1.02;
      text-shadow: 0 1px 1px rgba(0,0,0,0.10);
    }
    .cv-by {              /* 作者/出处小字 */
      font-family: "Songti SC", "STSong", "SimSun", serif;
      letter-spacing: 0.3em; opacity: 0.9;
    }
    .cv-bar {             /* 框内底部信息名牌：窄米色牌 + 细金边（参考图约6成宽居中） */
      position: absolute; left: 20%; right: 20%; bottom: 3%;
      height: 8.5cqw; max-height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 6.5cqw; font-weight: 700; letter-spacing: 0.16em; text-indent: 0.16em;
      border-radius: 2px; z-index: 5;
      border: 0.8px solid rgba(196,168,110,0.75);
      background: linear-gradient(180deg, #fdfbf3, #f4ecd6);
      color: #5a4a2c;
      box-shadow: 0 1px 2px rgba(0,0,0,0.10);
      white-space: nowrap; overflow: hidden;
    }
    .cv-cloud {           /* 右下角如意云纹 */
      position: absolute; right: 12%; bottom: 10.5%; width: 22%; height: 6%;
      z-index: 3; pointer-events: none; opacity: 0.6;
    }
    .cv-spine {           /* 左侧书脊深色竖条（精装立体感） */
      position: absolute; left: 0; top: 0; bottom: 0; width: 9%;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.18) 48%, rgba(0,0,0,0.08) 74%,
        rgba(255,255,255,0.16) 90%, rgba(255,255,255,0) 100%);
      pointer-events: none; z-index: 2;
    }
    .cv-spine::after {    /* 书脊压印横线 */
      content: ''; position: absolute; left: 14%; right: 14%; top: 5.5%; height: 1px;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 3px 0 rgba(255,255,255,0.12);
    }
    .cv-art { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    /* 木质书架层板 */
    .shelf-board {
      height: 10px;
      background: linear-gradient(180deg, #b08d5e 0%, #96754a 45%, #7d6039 100%);
      border-radius: 2px;
      box-shadow: 0 3px 6px rgba(42,38,34,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .seal-tag {
      display: inline-flex; align-items: center; justify-content: center;
      background: #a63a2b; color: #fff6ec;
      border-radius: 3px; font-size: 10px; padding: 2px 7px; font-weight: 700; letter-spacing: 0.15em;
      box-shadow: 0 1px 3px rgba(166,58,43,0.35);
    }
    .ghost-seal {
      display:inline-flex; align-items:center; justify-content:center;
      border: 1.5px solid #a63a2b; color:#a63a2b; border-radius:3px;
      font-size:10px; padding:1px 6px; font-weight:700; letter-spacing:0.15em;
    }
    .num-badge {
      font-variant-numeric: tabular-nums;
    }
    .tab-btn { transition: all .2s; }
    .tab-btn.active .tab-icon { transform: scale(1.18) translateY(-1px); }
    .tab-btn.active .tab-label { color: #a63a2b; }
    .tab-btn.active::after {
      content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
      width:4px; height:4px; border-radius:50%; background:#a63a2b;
    }
    .big-quote { font-family: 'Long Cang', 'Zhi Mang Xing', 'Ma Shan Zheng', serif; color: rgba(166,58,43,0.14); line-height: 0.8; }
    .brush-title { font-family: 'Long Cang', 'Zhi Mang Xing', 'Ma Shan Zheng', serif; }
    /* 品牌大字：毛笔楷书（马善政），浓墨笔锋 */
    .brand-title { font-family: 'Ma Shan Zheng', 'Long Cang', 'Zhi Mang Xing', serif; }
    input, textarea, select { outline: none; font-family: inherit; }
    input:focus, textarea:focus { border-color: #a63a2b !important; }
    .chip-on { background:#2a2622 !important; color:#f6f1e5 !important; border-color:#2a2622 !important; }
    #toast.toast-show { transform:translateX(-50%) translateY(0) !important; }
  </style>
</head>
<body class="texture-bg text-ink h-screen overflow-hidden">
  <div class="max-w-md mx-auto h-full flex flex-col relative shadow-2xl">

    <!-- ==================== 顶栏 ==================== -->
    <header class="px-5 pt-5 pb-2.5 shrink-0 bg-gradient-to-b from-paper via-paper to-transparent relative z-10">
      <!-- 背景梅枝：淡淡的墨梅，作宣纸底纹 -->
      <svg class="absolute right-0 top-5 w-[110px] h-[100px] pointer-events-none opacity-[0.15]" viewBox="0 0 150 130" fill="none">
        <path d="M150 20 C 128 26, 112 36, 100 50 M100 50 C 90 62, 80 72, 72 78 M100 50 C 108 60, 112 72, 112 84"
          stroke="#3a2a22" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M88 62 C 82 66, 76 70, 70 72 M78 72 C 72 74, 66 74, 60 72 M112 84 C 108 86, 104 86, 100 84"
          stroke="#4a362b" stroke-width="2" stroke-linecap="round"/>
        <!-- 花 -->
        <g fill="#a63a2b">
          <path d="M70 72 q -3 -6 2 -8 q 5 -1 4 5 q 4 -3 6 1 q 1 4 -4 5 q 2 4 -3 5 q -4 0 -3 -5 q -5 2 -6 -3 z"/>
          <path d="M112 84 q -2 -5 2 -6 q 4 -1 3 4 q 3 -2 4 1 q 1 3 -3 4 q 2 3 -2 4 q -3 0 -2 -4 q -4 2 -5 -2 z"/>
          <circle cx="60" cy="72" r="3"/><circle cx="100" cy="84" r="2.6"/>
        </g>
        <!-- 花苞 -->
        <circle cx="78" cy="72" r="1.6" fill="#a63a2b" opacity="0.8"/>
        <circle cx="124" cy="70" r="1.6" fill="#a63a2b" opacity="0.7"/>
      </svg>
      <div class="flex items-start justify-between">
        <!-- 左：品牌。方章在左，「余录」大字在其右，下方通栏小字「读书摘录」 -->
        <div class="flex flex-col">
          <div class="flex items-center gap-2.5">
            <!-- 方章：白字「余」 -->
            <span class="flex items-center justify-center shrink-0"
              style="width:31px;height:31px;background:#c0392b;border-radius:6px;box-shadow:0 2px 5px rgba(150,40,30,0.38)">
              <span class="brand-title text-[19px] leading-none" style="color:#fdf6ec">余</span>
            </span>
            <!-- 大字「余录」 -->
            <span class="brand-title text-[34px] leading-none tracking-[0.06em]"
              style="color:#1f1a16;text-shadow:0 2px 5px rgba(42,38,34,0.12)">余录</span>
          </div>
          <!-- 下方通栏小字：读书摘录 -->
          <p class="text-[10px] text-inklight tracking-[0.4em] mt-2 shrink-0 whitespace-nowrap">读　书　摘　录</p>
        </div>
        <div class="text-right pt-1 space-y-1.5">
          <p class="text-[11px] text-inklight num-badge"><span class="text-ink font-black text-base" id="header-count">0</span> 摘</p>
          <p class="text-[11px] text-inklight num-badge"><span class="text-ink font-black text-base" id="header-books">0</span> 书</p>
        </div>
      </div>
      <div class="mt-4 flex items-center gap-2">
        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-line to-line/40"></div>
        <span class="text-[9px] text-inklight/70 tracking-[0.3em]" id="header-date">—</span>
        <div class="h-px flex-1 bg-gradient-to-l from-transparent via-line to-line/40"></div>
      </div>
    </header>

    <!-- ==================== 主内容 ==================== -->
    <main class="flex-1 overflow-y-auto scroll-hide px-5 pb-36" id="main-content"></main>

    <!-- ==================== 底部导航 ==================== -->
    <nav class="absolute bottom-0 inset-x-0 bg-card/95 backdrop-blur-md border-t border-line">
      <div class="flex items-center justify-around px-2 pt-2 pb-3">
        <button class="tab-btn relative flex flex-col items-center gap-1 py-1 px-5" data-tab="quotes" onclick="switchTab('quotes')">
          <span class="tab-icon text-[22px] transition-transform">📜</span>
          <span class="tab-label text-[10px] font-bold text-inklight tracking-[0.25em]">文摘</span>
        </button>
        <button class="tab-btn relative flex flex-col items-center gap-1 py-1 px-5" data-tab="shelf" onclick="switchTab('shelf')">
          <span class="tab-icon text-[22px] transition-transform">📚</span>
          <span class="tab-label text-[10px] font-bold text-inklight tracking-[0.25em]">书架</span>
        </button>
        <button onclick="openAddModal()" class="w-[54px] h-[54px] -mt-7 rounded-full bg-gradient-to-b from-[#b8452f] to-[#96301f] text-white shadow-float border-[3px] border-paper flex items-center justify-center active:scale-95 transition-transform">
          <span class="brush-title text-[20px] leading-none mt-0.5">录</span>
        </button>
        <button class="tab-btn relative flex flex-col items-center gap-1 py-1 px-5" data-tab="maxims" onclick="switchTab('maxims')">
          <span class="tab-icon text-[22px] transition-transform">🪷</span>
          <span class="tab-label text-[10px] font-bold text-inklight tracking-[0.25em]">格言</span>
        </button>
        <button class="tab-btn relative flex flex-col items-center gap-1 py-1 px-5" data-tab="mine" onclick="switchTab('mine')">
          <span class="tab-icon text-[22px] transition-transform">🕯️</span>
          <span class="tab-label text-[10px] font-bold text-inklight tracking-[0.25em]">我的</span>
        </button>
      </div>
    </nav>

    <!-- 添加文摘弹窗 -->
    <div id="add-modal" class="hidden absolute inset-0 z-50">
      <div class="absolute inset-0 bg-ink/50 backdrop-blur-[2px]" onclick="closeAddModal()"></div>
      <div class="absolute inset-x-0 bottom-0 bg-card rounded-t-[28px] max-h-[90%] overflow-y-auto slide-up border-t-2 border-cinnabar/30">
        <div class="sticky top-0 bg-card/95 backdrop-blur px-6 pt-5 pb-4 border-b border-line flex items-center justify-between z-10">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-md bg-cinnabar flex items-center justify-center"><span class="text-white brush-title text-lg leading-none">摘</span></div>
            <h3 id="add-modal-title" class="font-black text-lg tracking-wide">新摘一句</h3>
          </div>
          <button onclick="closeAddModal()" class="w-9 h-9 rounded-full bg-paper border border-line text-inklight font-bold">✕</button>
        </div>
        <div class="px-6 py-5 space-y-5">
          <!-- 渠道切换：书本 / 影视台词 / 大神评论 / 经济原理 / 随笔 -->
          <div>
            <label class="block text-[11px] font-bold text-inklight mb-2 tracking-[0.2em]">记录类型</label>
            <div id="add-channel" class="grid grid-cols-5 gap-1.5"></div>
          </div>
          <div id="add-book-row" class="grid grid-cols-1 gap-3">
            <div id="add-source-cell">
              <label class="block text-[11px] font-bold text-inklight mb-1.5 tracking-[0.2em]">出处 <span id="add-source-star" class="text-cinnabar">✦</span></label>
              <input id="add-source" type="text" placeholder="《论语·阳货》" class="w-full px-3 py-2.5 rounded-xl border-2 border-line bg-paper text-sm">
            </div>
          </div>
          <select id="add-book" class="hidden"></select>
          <div>
            <label id="add-original-label" class="block text-[11px] font-bold text-inklight mb-1.5 tracking-[0.2em]">原文 <span class="text-cinnabar">✦</span></label>
            <textarea id="add-original" rows="3" placeholder="抄录打动你的句子…" class="w-full px-3 py-2.5 rounded-xl border-2 border-line bg-paper text-[15px] leading-relaxed resize-none"></textarea>
          </div>
          <!-- 随笔配图：拍照 / 相册，自动压缩 -->
          <div id="add-photo-row" style="display:none">
            <label class="block text-[11px] font-bold text-inklight mb-1.5 tracking-[0.2em]">配图 <span class="text-inklight font-normal tracking-normal">（可选 · 记下此刻的画面）</span></label>
            <div id="add-photo-preview" class="hidden mb-2"></div>
            <button type="button" id="btn-add-photo" onclick="document.getElementById('add-photo-input').click()"
              class="w-full py-3 rounded-xl border-2 border-dashed border-line bg-paper text-xs font-bold text-inklight active:scale-[0.98] transition-transform flex items-center justify-center gap-1.5">📷 选一张图（拍照或相册）</button>
            <input type="file" id="add-photo-input" accept="image/*" class="hidden" onchange="pickEssayPhoto(this)">
          </div>
          <div id="add-extra">
          <div>
            <label class="block text-[11px] font-bold text-inklight mb-1.5 tracking-[0.2em]">理解</label>
            <textarea id="add-understanding" rows="3" placeholder="用自己的话，说说它是什么意思…" class="w-full px-3 py-2.5 rounded-xl border-2 border-line bg-paper text-sm leading-relaxed resize-none"></textarea>
          </div>
          <div>

// ==================== 基础 ====================
/* 数据规范化：确保 quotes / books 恒为数组（防止同步数据缺字段导致渲染崩溃） */
function normalizeData(d) {
  if (!d || typeof d !== 'object') return JSON.parse(JSON.stringify(defaultData));
  const books = Array.isArray(d.books) ? d.books : [];
  const quotes = Array.isArray(d.quotes) ? d.quotes.map(q => ({ ...q, channel: q.channel || '书本' })) : [];
  // 数据修复：书本渠道的老摘录若没挂靠 bookId，按出处到已有书架里补挂（不新建书，避免旧数据撑爆书架）
  quotes.forEach(q => {
    if (q.channel === '书本' && !q.bookId && q.source && q.source !== '未注明出处') {
      const bare = q.source.replace(/[《》]/g, '').replace(/[—－-]{1,2}.*$/, '').replace(/[（(]?第[一二三四五六七八九十\d]+[部册卷篇][）)]?$/, '').trim();
      const hit = bare && books.find(b => b.name === bare || bare.startsWith(b.name) || b.name.startsWith(bare));
      if (hit) q.bookId = hit.id;
    }
  });
  return { quotes, books };
}
function loadData() {
  // 旧版「拾句」数据无损迁移到新版「余录」（仅当新 key 尚无数据时）
  if (!localStorage.getItem(STORE_KEY) && localStorage.getItem(OLD_STORE_KEY)) {
    try { localStorage.setItem(STORE_KEY, localStorage.getItem(OLD_STORE_KEY)); } catch (e) {}
  }
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) { try { data = normalizeData(JSON.parse(saved)); } catch (e) {} }
}
function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));

}

}

function renderQuoteCard(q) {
  if (q.channel === '随笔') return renderEssayCard(q);   // 随笔用信笺日记卡
  const isBook = q.channel === '书本';
  const book = data.books.find(b => b.id === q.bookId);
  const c = isBook ? (book ? book.color : '#8e3b2c') : (CHANNEL_COLOR[q.channel] || '#8e3b2c');
  // 左上角标签：优先显示实际出处（如「道德经」），无出处时回落到书名/未分类
  const srcTag = (q.source && q.source !== '未注明出处')
    ? q.source.replace(/》\s*/g, ' ').replace(/[《》]/g, '').replace(/[—－-]{1,2}\s*/g, ' ').replace(/\s+/g, ' ').trim()
    : '';
  const tagLabel = isBook ? (srcTag || (book ? book.name : '未分类')) : (q.channel || '佳句');
  const relatedCount = (q.related || []).length;
  const meta = [];
  if (q.example) meta.push('举例');
  if (q.note) meta.push('注意');
  return `
    <div class="letter-card rounded-2xl overflow-hidden cursor-pointer fade-in" onclick="openDetail('${q.id}')">
      <!-- 左书签色带 + 角部装饰 -->
      <span class="corner-deco border-l-2 border-t-2" style="left:8px;top:8px"></span>
      <span class="corner-deco border-r-2 border-b-2" style="right:8px;bottom:8px"></span>
      <div class="flex">
        <div class="w-[7px] shrink-0" style="background:linear-gradient(180deg,${c},${c}aa)"></div>
        <div class="flex-1 px-5 py-4 min-w-0">

            <div class="flex items-center gap-2 min-w-0">
              <span class="seal-tag truncate max-w-[130px]" style="background:${c}">${tagLabel}</span>
              <span class="text-[10px] text-inklight num-badge shrink-0">${fmtDate(q.createdAt)}</span>
            </div>
            ${relatedCount ? `<span class="ghost-seal" style="border-color:${c};color:${c}">佳句 ×${relatedCount}</span>` : ''}
          </div>
          <div class="relative">
            <span class="big-quote absolute -left-1 -top-3 text-[44px] select-none">「</span>
            <p class="text-[15.5px] leading-[1.9] font-bold pl-5 pt-1">${q.original}</p>
            <p class="text-right text-[11px] text-inklight mt-2 pr-1">—— ${q.source}</p>
          </div>
          ${q.understanding ? `
          <div class="mt-3.5 relative pl-3.5">
            <div class="absolute left-0 top-1 bottom-1 w-[2px] rounded" style="background:linear-gradient(180deg,${c},${c}44)"></div>
            <p class="text-xs leading-[1.9] text-inklight"><span class="ghost-seal mr-1.5" style="border-color:${c}99;color:${c}">理解</span>${q.understanding}</p>
          </div>` : ''}
          ${meta.length ? `
          <div class="flex gap-2 mt-3.5 pt-3 border-t border-dashed border-line">
            ${meta.map(m => `<span class="text-[10px] font-bold text-inklight bg-paper border border-line rounded-full px-2.5 py-0.5">${m}</span>`).join('')}
            <span class="ml-auto text-[10px] text-cinnabar/60 font-bold">点开详注 →</span>

  ['管理', ['管理', '领导力', '穷查理', '原则', '从优秀到卓越', '卓有成效', '德鲁克', '稻盛和夫', '活法', '干法']],
  ['现当代文学', ['平凡的世界', '路遥', '活着', '余华', '莫言', '围城', '钱钟书', '边城', '沈从文', '白鹿原', '穆斯林的葬礼', '三体', '刘慈欣']],

function guessCategory(name) {
  const n = String(name || '').replace(/[《》\s]/g, '');
  if (!n) return '';
  for (const [cat, keys] of CAT_KEYWORDS) {
    if (keys.some(k => n.includes(k))) return cat;
  }
  return '';
}

/* 生成一本书的封面 HTML
   封面宽高比固定 2:3，尺寸随容器自适应（字号用 cqw 容器单位，随封面缩放） */
function bookCoverHTML(b, h, n) {
  const pal = COVER_PALETTE[b.category] || MOTIF_DEFAULT;
  const bg = pal.bg;                       // 系列封面：颜色只由分类决定
  const nameChars = [...(b.name || '书')];
  const nameLen = nameChars.length;
  const light = pal.ink === '#ffffff';     // 白字封面（深底）

  // 竖排：≤4 字；≥5 字横排（参考图：经济学原理/穷查理宝典/置身事内 均横排大字）
  // 例外：含「的」的 5 字书名（平凡的世界）参考图为竖排，保持竖排
  const vert = nameLen <= 4 || (nameLen === 5 && b.name.includes('的'));
  // 字号以封面宽度百分比表示（cqw），随封面缩放
  // 横排需保证总宽度 = 字数 × 字号 ≤ 封面可用宽度（约 82cqw），故字号随字数递减
  const nameSize = vert
    ? (nameLen <= 2 ? '27cqw' : nameLen <= 3 ? '22cqw' : '18cqw')
    : (nameLen <= 5 ? '14cqw' : nameLen <= 6 ? '12.5cqw' : nameLen <= 8 ? '10.5cqw' : '9cqw');

  // 底色
  let bgCss;
  if (pal.type === 'farm') {
    bgCss = `linear-gradient(180deg, ${bg} 0%, ${bg} 30%, #efdba0 56%, #f3e6bb 100%)`;
  } else if (pal.type === 'sepia') {
    bgCss = `linear-gradient(180deg, #fefff8 0%, #fbf6ea 52%, #c78962 60%, #bd7f56 100%)`;
  } else {
    bgCss = `linear-gradient(168deg, ${shade(bg, 9)} 0%, ${bg} 55%, ${shade(bg, -9)} 100%)`;
  }

  // 线/字配色：白字封面用浅线，其余用深线
  const lineCol = light ? 'rgba(255,255,255,0.62)' : 'rgba(58,48,32,0.36)';
  const inkCol = pal.ink;
  const decoBg = light ? 'rgba(255,255,255,0.16)' : 'rgba(58,48,32,0.06)';

  // 图形层定位：一律避让书名区（竖排书名约占 top 22%~72%；横排书名约占 top 13%~30%）
  let artHTML = '';
  if (pal.art === 'field' || pal.art === 'city') {
    // 田野/城市：贴底，参考图里占下半幅
    artHTML = `<div class="cv-art" style="top:auto;bottom:0;height:38%;opacity:${b.finished ? 0.75 : 1}">${coverArt(pal.art, inkCol, false)}</div>`;
  } else if (pal.art === 'taiji') {
    // 太极：竖排书名偏右，太极置于左侧偏下（参考图：道德经）
    artHTML = `<div class="cv-art" style="top:42%;height:34%;opacity:${b.finished ? 0.7 : 0.95}">${coverArt(pal.art, inkCol, false)}</div>`;
  } else if (pal.art === 'sail') {
    // 帆船：横排书名时置于书名上方，竖排时置于底部
    const sailTop = vert ? '56%' : '9%';
    artHTML = `<div class="cv-art" style="top:${sailTop};height:24%;opacity:${b.finished ? 0.7 : 1}">${coverArt(pal.art, inkCol, false)}</div>`;
  } else if (pal.art === 'grid') {
    // 线稿网络：横排书名下方大面积铺开（参考图：经济学原理）
    const gridTop = vert ? '54%' : '42%';
    artHTML = `<div class="cv-art" style="top:${gridTop};height:40%;opacity:${b.finished ? 0.55 : 0.85}">${coverArt(pal.art, inkCol, false)}</div>`;
  } else if (pal.art === 'scroll') {
    artHTML = `<div class="cv-art" style="top:58%;height:26%;opacity:${b.finished ? 0.55 : 0.75}">${coverArt(pal.art, inkCol, false)}</div>`;
  }

  // 竖排书名：道德经这类需偏右（因为左侧有太极）；其余居中
  const vertShift = pal.art === 'taiji' ? 'right:14%;left:auto;transform:none' : 'left:50%;transform:translateX(-50%)';
  // 竖排书名起点：参考图约从封面 20% 处起（字号越小越往上，整体视觉居中）
  const vertTop = nameLen <= 2 ? '24%' : nameLen <= 3 ? '21%' : '20%';
  // 横排书名垂直位置：参考图约在封面 24%~30% 处（印章下方留白）
  const horizTop = (b.author && b.author !== '佚名') ? '23%' : '26%';

  return `
    <div class="book-cover relative cv-cloth" style="background:${bgCss};width:100%;aspect-ratio:2/3;container-type:inline-size">
      ${artHTML}
      <div class="cv-line" style="border-color:${lineCol}"></div>
      <div class="cv-seal" style="background:${decoBg};color:${inkCol};box-shadow:inset 0 0 0 1px ${lineCol};opacity:0.9">${nameChars[0]}</div>
      <span class="cv-dot" style="right:13%;background:${decoBg};box-shadow:inset 0 0 0 1px ${lineCol}"></span>

      ${vert
        ? `<div style="position:absolute;${vertShift};top:${vertTop};display:flex;flex-direction:row;align-items:flex-start;z-index:4;color:${inkCol}">
             <span class="cv-name" style="font-size:${nameSize};writing-mode:vertical-rl;text-orientation:upright">${b.name}</span>
             ${b.author && b.author !== '佚名'
               ? `<span class="cv-by" style="font-size:6.5cqw;writing-mode:vertical-rl;text-orientation:upright;margin-left:5cqw;align-self:flex-end;white-space:nowrap">${b.author}</span>`
               : ''}
           </div>`
        : `<div style="position:absolute;left:50%;transform:translateX(-50%);top:${horizTop};width:86%;text-align:center;color:${inkCol};z-index:4">
             <p class="cv-name" style="font-size:${nameSize};letter-spacing:0.02em;line-height:1.05">${b.name}</p>
             ${b.author && b.author !== '佚名' ? `<p class="cv-by" style="font-size:6cqw;margin-top:3.5cqw">${b.author}</p>` : ''}
           </div>`}

      <span class="cv-cloud" style="color:${inkCol}">${coverArt('cloud', inkCol, true)}</span>
      <div class="cv-bar">${b.category && b.category !== '待归类' ? b.category : '余　录'}</div>
      <span class="cv-spine"></span>

        ? `<span class="absolute top-1.5 right-1.5 text-[8px] px-1.5 py-0.5 rounded-sm font-bold tracking-[0.15em] z-20"
             style="background:rgba(255,255,255,0.88);color:#3a2b22;font-size:7cqw">读 完</span>`
        : ''}
    </div>`;
}
/* 判断底色深浅（决定封面文字/线条用深色还是浅色） */
function isDarkBg(hex) {
  const c = hex.replace('#', '');
  const num = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
  const r = num >> 16, g = (num >> 8) & 255, bl = num & 255;
  // 亮度阈值 150：低于则视为「深底」，文字与框线改用浅色（保证对比）
  return (0.299 * r + 0.587 * g + 0.114 * bl) < 150;
}
/* 颜色加深/变浅（用于封面渐变收口） */
function shade(hex, amt) {
  const c = hex.replace('#', '');
  const num = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
  let r = (num >> 16) + amt, g = ((num >> 8) & 255) + amt, bl = (num & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); bl = Math.max(0, Math.min(255, bl));
  return '#' + ((r << 16) | (g << 8) | bl).toString(16).padStart(6, '0');
}

    ? q.source.replace(/》\s*/g, ' ').replace(/[《》]/g, '').replace(/[—－-]{1,2}\s*/g, ' ').replace(/\s+/g, ' ').trim()

/* ==================== 随笔配图：选图 → 压缩 → 预览 ==================== */
let pendingPhoto = null;    // 压缩后的 dataURL（待随随笔保存）
function compressPhoto(file, cb) {
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e) => {
    img.onload = () => {
      // 最长边压到 720px（配图是点缀，够清晰也省流量/省存储）
      const maxSide = 720;
      let w = img.width, h = img.height;
      if (w > maxSide || h > maxSide) {
        const r = Math.min(maxSide / w, maxSide / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function showPhotoPreview(dataUrl) {
  const pv = document.getElementById('add-photo-preview');
  pv.classList.remove('hidden');
  pv.innerHTML = `
    <div class="relative inline-block">
      <img src="${dataUrl}" class="w-24 h-24 object-cover rounded-xl border-2 border-line shadow-card">
      <button type="button" onclick="removeEssayPhoto()" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-ink text-white text-[11px] font-black flex items-center justify-center shadow active:scale-90 transition-transform">✕</button>
    </div>`;
  document.getElementById('btn-add-photo').classList.add('hidden');
}

  if (!f) return;
  if (!/^image\//.test(f.type)) { showToast('只能选图片哦'); input.value = ''; return; }
  compressPhoto(f, (dataUrl) => {
    pendingPhoto = dataUrl;
    showPhotoPreview(dataUrl);
  });
  input.value = '';
}

/* 出处书名 → 书架书 id：先模糊匹配已有书；匹配不到就自动上架一本新书（默认「待归类」）。
   返回 { id, created } —— created 为新建的书名（若新建），供保存后提示用。 */
let autoCreatedBook = null;
function matchOrCreateBook(srcText) {
  autoCreatedBook = null;
  if (!srcText) return null;
  // 归一化：去书名号、去作者破折号，取出书名主体
  const bare = srcText.replace(/[《》]/g, '').replace(/[—－-]{1,2}.*$/, '').trim();
  if (!bare) return null;
  // 1) 精确 / 前缀匹配已有书
  const hit = data.books.find(b => b.name === bare || bare.startsWith(b.name) || b.name.startsWith(bare));
  if (hit) return hit.id;
  // 2) 自动上架：书名取 bare，去掉「第一部 / 上册」这类册次后缀
  const bookName = bare.replace(/[（(]?第[一二三四五六七八九十\d]+[部册卷篇][）)]?$/, '').trim() || bare;
  // 二次确认：去掉册次后可能又能匹配上
  const hit2 = data.books.find(b => b.name === bookName);
  if (hit2) return hit2.id;
  // 3) 新建书：用书架上用得最少的颜色，分类「待归类」
  const use = {};
  data.books.forEach(b => { use[b.color] = (use[b.color] || 0) + 1; });
  const color = [...BOOK_COLORS].sort((a, b) => (use[a] || 0) - (use[b] || 0))[0];
  const nb = { id: 'b' + Date.now(), name: bookName, author: '', category: '待归类', color, finished: false, finishDate: '' };
  data.books.push(nb);
  autoCreatedBook = bookName;
  return nb.id;
}

function saveQuote() {
  const original = document.getElementById('add-original').value.trim();
  if (!original) { showToast(editingId ? '正文不能为空' : '请先抄录原文'); return; }
  const isEdit = !!editingId;
  const target = isEdit ? data.quotes.find(x => x.id === editingId) : null;
  if (isEdit && !target) { editingId = null; return; }
  const manualRelated = document.getElementById('add-related').value.trim().split('\n').filter(Boolean).map(line => {
    let type = '古文', rest = line;
    const m = line.match(/^(古文|中文|English|英文|英谚|谚语)\s*[｜|:：]?\s*(.*)$/);
    if (m) { type = (m[1] === '英文' || m[1] === '英谚' || m[1] === '谚语') ? 'English' : '古文'; rest = m[2] || line; }
    if (/^[a-zA-Z]/.test(rest) && !m) type = 'English';
    const srcMatch = rest.match(/^(.*?)[—－-]{1,2}\s*(《[^》]+》|.+)$/);
    return { type, text: srcMatch ? srcMatch[1].trim() : rest, source: srcMatch ? srcMatch[2].trim() : '' };
  });
  // 合并勾选的自动搜罗相似句
  const autoRelated = pendingAutoSimilar.filter((s, i) => {
    const cb = document.getElementById('auto-chk-' + i);
    return cb ? cb.checked : false;
  }).map(s => ({ type: s.type, text: s.text, source: s.source, from: s.from }));
  const related = [...autoRelated, ...manualRelated];
  const isBook = addChannel === '书本';
  const isEssay = addChannel === '随笔';
  // 编辑时：AI/精选搜罗的相似句原样保留，只重算手动部分
  const keepAuto = isEdit ? (target.related || []).filter(r => r.from === 'ai' || r.from === 'lib') : [];
  const finalRelated = isEdit ? [...keepAuto, ...related] : related;
  // bookId：按「出处」书名去书架匹配；匹配不到则「自动上架」一本新书（默认待归类）
  let matchedBookId = null;
  const srcText = isEssay ? '' : document.getElementById('add-source').value.trim();
  if (isBook && srcText) {
    matchedBookId = matchOrCreateBook(srcText);
  }
  const fields = {
    channel: addChannel,
    bookId: matchedBookId,
    original,
    source: isEssay ? '' : (srcText || (isBook ? '未注明出处' : addChannel)),
    photo: isEssay ? (pendingPhoto || '') : '',
    understanding: document.getElementById('add-understanding').value.trim(),
    example: document.getElementById('add-example').value.trim(),
    note: document.getElementById('add-note').value.trim(),
    related: finalRelated,
  };
  if (isEdit) {
    Object.assign(target, fields);
  } else {

// 关键词 → 排序计分：把原文匹配到的主题按命中个数排序
function scoreTopics(text) {
  const scores = {};
  for (const [topic, kws] of THEME_KEYWORDS) {
    let s = 0;
    for (const kw of kws) { if (text.includes(kw)) s += kw.length; } // 更长关键词更可信
    if (s > 0) scores[topic] = s;
  }
  return Object.entries(scores).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

// 内置库挑选：从匹配的主题里取 2-3 句（尽量古文英谚混搭，最多保留库中数量）
function pickFromLib(topics) {
  const all = topics.length ? topics : ['勤学', '立志奋斗', '诚信守诺']; // 无匹配时给通用兜底主题
  const picked = [];
  const seen = new Set();
  const want = 3;
  const pushItem = (type, text, source) => {
    if (picked.length >= want || seen.has(text)) return;
    seen.add(text);
    picked.push({ type, text, source, from: 'lib' });
  };
  for (const t of all) {
    const group = SIMILAR_LIB[t]; if (!group) continue;
    const gArr = group.g || []; const eArr = group.e || [];
    const n = Math.max(gArr.length, eArr.length);
    for (let i = 0; i < n && picked.length < want; i++) {
      if (i < gArr.length) pushItem('古文', gArr[i].text, gArr[i].source);
      if (picked.length < want && i < eArr.length) pushItem('English', eArr[i].text, eArr[i].source);
    }
  }
  // 主主题凑不满时，从其他主题补足（保持双语均衡）
  if (picked.length < want) {
    const wantG = picked.filter(x => x.type === '古文').length;
    const wantE = picked.filter(x => x.type === 'English').length;
    for (const [k, group] of Object.entries(SIMILAR_LIB)) {
      if (all.includes(k) || picked.length >= want) continue;
      for (const x of (wantE <= wantG ? (group.g||[]) : (group.e||[]))) {
        pushItem(wantE <= wantG ? '古文' : 'English', x.text, x.source);
        if (picked.length >= want) break;
      }
    }
  }
  return picked.slice(0, want);
}

async function tryAiFindSimilar(text) {

    method: 'POST',

    body: JSON.stringify({ model: SIMILAR_AI.model, messages: [

function setSync(s) { try { s ? localStorage.setItem(SYNC_KEY, JSON.stringify(s)) : localStorage.removeItem(SYNC_KEY); } catch (e) {} }

/* base64 UTF-8 安全编解码（分块防栈溢出） */
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(String(b64).replace(/\n/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}

async function ghFetch(method, path, body, token) {
  return fetch(GH.api + path, {
    method,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
}

/* 从私有仓库读数据文件；不存在返回 null */
async function ghGetFile(code, token) {
  const res = await ghFetch('GET', '/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path(code), null, token);
  if (res.status === 404) return null;
  if (res.status === 401) throw new Error('Token 无效或已过期');
  if (!res.ok) throw new Error('GitHub HTTP ' + res.status);
  const j = await res.json();
  return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
}

/* 写数据文件（存在时需带 sha）；返回新 sha */
async function ghPutFile(code, token, obj, sha) {
  const body = { message: 'yulu sync ' + new Date().toISOString(), content: b64enc(JSON.stringify(obj)) };
  if (sha) body.sha = sha;
  const res = await ghFetch('PUT', '/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path(code), body, token);
  if (res.status === 401) throw new Error('Token 无效或已过期');
  if (res.status === 409 || res.status === 422) throw new Error('CONFLICT');
  if (!res.ok) throw new Error('GitHub HTTP ' + res.status);
  const j = await res.json();
  return j.content ? j.content.sha : sha;
}

async function syncSaveToken() {
  const input = document.getElementById('sync-token-input');
  if (!input) return;

  let migrateCode = null;
  if (raw.includes('|')) {

      migrateCode = null;
    }
  }
  const token = raw;
  if (token.length < 20) { showToast('Token 格式看起来不对'); return; }
  if (syncBusy) return; syncBusy = true;
  try {
    const res = await fetch(GH.api + '/user', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error(res.status === 401 ? 'Token 无效或已过期' : '验证失败 HTTP ' + res.status);
    const s = getSync() || {};
    setSync(Object.assign(s, { token }));

      render();

}

/* 换机迁移：一键复制「Token|同步码」口令，新手机粘贴一次即可 */
function syncMigrate() {
  const s = getSync();
  if (!s || !s.token || !s.code) return;
  const cmd = s.token + '|' + s.code;
  if (navigator.clipboard && navigator.clipboard.writeText) {

/* 生成新同步码（在私有仓库创建数据文件） */
async function syncCreate() {
  const s = getSync();
  if (!s || !s.token) { showToast('请先保存 GitHub Token'); return; }
  if (syncBusy) return; syncBusy = true;
  try {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    const seg = () => Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    let code = 'YL-' + seg() + '-' + seg();
    while (await ghGetFile(code, s.token)) { code = 'YL-' + seg() + '-' + seg(); } // 确保码未占用
    const updatedAt = Date.now();
    const sha = await ghPutFile(code, s.token, { updatedAt, payload: data });
    setSync({ token: s.token, code, sha, lastSyncAt: updatedAt });
    clearSyncDirty();
    showToast('同步码已生成并上传 ✓');
    render();
  } catch (e) { showToast('生成失败：' + e.message); }
  finally { syncBusy = false; }
}

/* 输入同步码绑定（新设备）；migrateCode 由迁移口令自动传入 */
async function syncJoin(migrateCode) {
  const s = getSync();
  if (!s || !s.token) { showToast('请先保存 GitHub Token'); return; }
  let code;
  if (migrateCode) {
    code = String(migrateCode).trim().toUpperCase();
  } else {
    const input = document.getElementById('sync-code-input');
    if (!input) return;
    code = (input.value || '').trim().toUpperCase();
  }
  if (!/^YL-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(code)) { showToast('同步码格式：YL-XXXX-XXXX'); return; }
  if (syncBusy) return; syncBusy = true;
  try {
    const file = await ghGetFile(code, s.token);
    if (file) {
      if (file.data.payload && (file.data.payload.quotes || file.data.payload.books)) {
        // 双向合并：本地已有的书不会被云端清掉
        const merged = mergeData(data, file.data.payload);
        const needPush = !sameData(merged, file.data.payload);
        data = merged;
        try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
        let sha = file.sha;
        if (needPush) sha = await ghPutFile(code, s.token, { updatedAt: Date.now(), payload: data }, file.sha);
        setSync({ token: s.token, code, sha, lastSyncAt: file.data.updatedAt || 0 });
        clearSyncDirty();
        showToast(needPush ? '绑定成功，本地书目已合并 ✓' : '绑定成功，已同步 ✓');
        render();
      } else {
        setSync({ token: s.token, code, sha: file.sha, lastSyncAt: file.data.updatedAt || 0 });
        clearSyncDirty();
        showToast('绑定成功，已同步 ✓');
        render();
      }
    } else {
      const updatedAt = Date.now();
      const sha = await ghPutFile(code, s.token, { updatedAt, payload: data });
      setSync({ token: s.token, code, sha, lastSyncAt: updatedAt });
      clearSyncDirty();
      showToast('已用该码上传本地数据 ✓');
      render();
    }
  } catch (e) { showToast('绑定失败：' + e.message); }
  finally { syncBusy = false; }
}

/* 推送本地数据到 GitHub */
async function syncPush() {
  const s = getSync(); if (!s || !s.token || !s.code) return;
  const updatedAt = Date.now();
  let sha;
  try {
    sha = await ghPutFile(s.code, s.token, { updatedAt, payload: data }, s.sha);
  } catch (e) {
    if (e.message === 'CONFLICT') {
      // 远端被其他设备改过：拉最新后按 id 双向合并（不整份覆盖，避免丢本地新书）
      const file = await ghGetFile(s.code, s.token);
      if (file && file.data.payload) {
        const merged = mergeData(data, file.data.payload);
        data = merged;
        try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (er) {}
        sha = await ghPutFile(s.code, s.token, { updatedAt, payload: data }, file.sha);
        markSyncDirty(); clearSyncDirty();
        render();
        setSync({ token: s.token, code: s.code, sha, lastSyncAt: updatedAt });
        return;
      }
      sha = await ghPutFile(s.code, s.token, { updatedAt, payload: data }, file ? file.sha : undefined);
    } else { throw e; }
  }
  setSync({ token: s.token, code: s.code, sha, lastSyncAt: updatedAt });
}

/* 按 id 逐项合并两组数据：两边都保留，同 id 时取 updatedAt 新的一方
   （本地刚编辑的书带新时间戳会覆盖云端；云端修正也会正确下发） */
function mergeById(localArr, remoteArr) {
  const byId = new Map();
  (Array.isArray(localArr) ? localArr : []).forEach(x => {
    if (!x || !x.id || byId.has(x.id)) return;
    byId.set(x.id, x);
  });
  (Array.isArray(remoteArr) ? remoteArr : []).forEach(x => {
    if (!x || !x.id || byId.has(x.id)) return;
    const old = byId.get(x.id);
    if (!old) { byId.set(x.id, x); return; }
    const lt = old.updatedAt || 0, rt = x.updatedAt || 0;
    if (rt > lt) byId.set(x.id, x);   // 云端更新 → 采用云端
  });
  return [...byId.values()];
}
function mergeData(localD, remoteD) {
  const l = localD || {}, r = remoteD || {};
  return normalizeData({
    books: mergeById(l.books, r.books),
    quotes: mergeById(l.quotes, r.quotes),
  });
}
/* 两包数据是否等价（用于判断合并后是否需要回推） */
function sameData(a, b) {
  const k = (d) => JSON.stringify({ b: d.books, q: d.quotes });
  return k(a) === k(b);
}

/* 立即同步（手动 / 启动 / 切前台）—— 双向合并，绝不整份覆盖 */
async function syncNow(manual) {
  const s = getSync(); if (!s || !s.token || !s.code || syncBusy) return;
  syncBusy = true;
  try {
    const file = await ghGetFile(s.code, s.token);
    const remoteAt = file ? (file.data.updatedAt || 0) : 0;
    const remoteOk = file && file.data.payload && (file.data.payload.quotes || file.data.payload.books);

    if (remoteOk && remoteAt > s.lastSyncAt) {
      // 云端有更新：双向合并（本地独有的书不会被清掉），合并结果落本地
      const merged = mergeData(data, file.data.payload);
      const needPush = !sameData(merged, file.data.payload); // 本地有云端没有的东西 → 需回推
      data = merged;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
      setSync({ token: s.token, code: s.code, sha: file.sha, lastSyncAt: remoteAt });
      if (needPush) { markSyncDirty(); clearSyncDirty(); await syncPush(); }
      else clearSyncDirty();
      render();
      if (manual) showToast(needPush ? '已合并并上传 ✓' : '同步完成 ✓');
    } else if (syncDirty || s.lastSyncAt === 0) {
      await syncPush();
      clearSyncDirty();
      if (manual) showToast('同步完成 ✓');
    } else if (manual) {
      showToast('已是最新 ✓');
    }
  } catch (e) { if (manual) showToast('同步失败：' + e.message); }
  finally { syncBusy = false; if (currentTab === 'mine') render(); }
}

}

function feTermDay(y2, c) { return Math.floor(y2 * 0.2422 + c) - Math.floor(y2 / 4); }
function feCurrentTerm(date) {
  const y = date.getFullYear(), y2 = y % 100;
  let prev = { n: '冬至', m: date.getMonth() + 1 === 12 ? 12 : 12, d: feTermDay((y - 1) % 100, 21.94) };
  for (const t of TERMS_FE) {
    const tDate = new Date(y, t.m - 1, feTermDay(y2, t.c));
    if (tDate <= date) prev = { n: t.n, m: t.m, d: feTermDay(y2, t.c) };
  }
  return { name: prev.n, isTermDay: (prev.m === date.getMonth() + 1 && prev.d === date.getDate()) };
}
function feWeatherInfo(code) {
  if (code === 0) return { text: '晴', g: 'sunny' };
  if ([1, 2].includes(code)) return { text: '多云', g: 'cloudy' };
  if (code === 3) return { text: '阴', g: 'cloudy' };
  if ([45, 48].includes(code)) return { text: '雾', g: 'fog' };
  if ([51, 53, 55, 56, 57].includes(code)) return { text: '毛毛雨', g: 'rain' };
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: '雨', g: 'rain' };
  if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: '雪', g: 'snow' };
  if ([95, 96, 99].includes(code)) return { text: '雷雨', g: 'storm' };
  return { text: '多云', g: 'cloudy' };
}

/* 前端本地计算每日佳句（节气 + 天气 + 经典句库） */
async function localDaily(dateStr, lat, lon) {
  const date = new Date(dateStr + 'T12:00:00+08:00');
  const term = feCurrentTerm(date);
  const seed = parseInt(dateStr.replace(/-/g, ''), 10);
  const weekday = '星期' + ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
  let weather = null;
  if (lat != null && lon != null) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3500);
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true&timezone=auto', { signal: ctrl.signal });
      clearTimeout(timer);
      const w = await r.json();
      if (w && w.current_weather) {
        const info = feWeatherInfo(w.current_weather.weathercode);
        weather = { text: info.text, g: info.g, temp: Math.round(w.current_weather.temperature) };
      }
    } catch (e) {}
  }
  const quotes = [];
  const tq = TERM_QUOTES_FE[term.name] || [];
  const hash = (str) => { let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  const seedSort = (a, b) => ((hash(a[0]) ^ seed * 2654435761) % 997) - ((hash(b[0]) ^ seed * 2654435761) % 997);
  if (term.isTermDay) tq.forEach((q) => quotes.push({ text: q[0], source: q[1], tag: '今日' + term.name }));
  CLASSIC_QUOTES_FE.slice().sort(seedSort).slice(0, 4).forEach((q) => quotes.push({ text: q[0], source: q[1], tag: q[2] }));
  if (!term.isTermDay && tq.length) tq.forEach((q) => quotes.push({ text: q[0], source: q[1], tag: term.name }));
  if (weather && WEATHER_QUOTES_FE[weather.g]) WEATHER_QUOTES_FE[weather.g].forEach((q) => quotes.push({ text: q[0], source: q[1], tag: weather.text }));
  GEN_QUOTES_FE.slice().sort(seedSort).slice(0, 2).forEach((q) => quotes.push({ text: q[0], source: q[1], tag: '读书' }));
  return { ok: true, date: dateStr, weekday, term: { name: term.name, isTermDay: term.isTermDay }, weather, hot: null, quotes };
}

async function loadDaily() {
  const today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
  /* 同一天先用本地缓存（秒开） */
  try {
    const cached = JSON.parse(localStorage.getItem('yulu-daily2') || 'null');
    if (cached && cached.date === today && cached.data && cached.data.ok) {
      dailyData = cached.data; renderDaily(); return;
    }
  } catch (e) {}
  /* IP 定位（尽力而为，2.5 秒超时） */
  let lat = null, lon = null;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
    clearTimeout(timer);
    const j = await r.json();
    if (j && typeof j.latitude === 'number' && typeof j.longitude === 'number') { lat = j.latitude; lon = j.longitude; }
  } catch (e) {}
  /* 优先服务端（含热搜）；3 秒超时后转前端本地计算 */
  let j = null;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch('/api/daily?lat=' + lat + '&lon=' + lon, { signal: ctrl.signal });
    clearTimeout(timer);
    j = await r.json().catch(() => null);
    if (!j || !j.ok) j = null;
  } catch (e) {}
  if (!j) j = await localDaily(today, lat, lon);
  if (j && j.ok) {
    dailyData = j; dailyIndex = 0;
    try { localStorage.setItem('yulu-daily2', JSON.stringify({ date: today, data: j })); } catch (e) {}
  }
  renderDaily();
}

function renderDaily() {
  const el = document.getElementById('daily-card');
  if (!el) return;
  if (!dailyData || !dailyData.ok || !(dailyData.quotes || []).length) { el.innerHTML = ''; return; }
  const d = dailyData;
  const qs = d.quotes;
  const q = qs[dailyIndex % qs.length];
  const parts = d.date.split('-');
  const mm = parseInt(parts[1], 10), dd = parseInt(parts[2], 10);
  const termBadge = d.term && d.term.name
    ? `<span class="seal-tag" style="background:#c0392b">${d.term.isTermDay ? '今日' + d.term.name : d.term.name}</span>` : '';
  const w = d.weather
    ? `<span class="text-[11px] text-inklight tracking-wider">${wEmoji(d.weather.text)} ${d.weather.text} ${d.weather.temp}°</span>` : '';
  const hot = (d.hot && d.hot.length)
    ? `<p class="text-[9px] text-inklight/60 mt-3 pt-2.5 border-t border-dashed border-line tracking-wider truncate">今日热点 · ${d.hot.join(' · ')}</p>` : '';
  el.innerHTML = `
    <div class="letter-card rounded-2xl p-6 mb-5 fade-in relative overflow-hidden">
      <span class="corner-deco border-l-2 border-t-2" style="left:8px;top:8px"></span>
      <span class="corner-deco border-r-2 border-b-2" style="right:8px;bottom:8px"></span>
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-[13px] font-black tracking-[0.1em] num-badge">${mm}月${dd}日</span>
          <span class="text-[11px] text-inklight">${d.weekday}</span>
          ${termBadge}
        </div>
        ${w}
      </div>
      <p class="brush-title text-[25px] leading-snug text-center py-3 px-2"
         style="color:#2a2622;text-shadow:0 1px 3px rgba(42,38,34,0.08)">「 ${q.text} 」</p>
      <div class="flex items-center justify-between mt-1">
        <p class="text-[11px] text-inklight pl-1">—— ${q.source}${q.tag ? ' <span class="opacity-60">· ' + q.tag + '</span>' : ''}</p>
        <button onclick="dailyNext()" class="text-[11px] text-cinnabar font-bold active:scale-95 transition-transform shrink-0">换一句 ↻</button>
      </div>
      ${hot}
    </div>`;
}

function dailyNext() { dailyIndex++; renderDaily(); }

// ==================== 启动 ====================
loadData();
switchTab('quotes');
if (getSync()) syncNow(false);
loadDaily();

// ==================== PWA：注册 Service Worker ====================
/* 若链接带 query（如 ?sharecode=），把它并入 manifest start_url，
   保证安装到主屏后打开的地址与授权链接一致 */
(function fixManifestStartUrl() {
  if (!location.search) return;
  const link = document.querySelector('link[rel="manifest"]');
  if (!link) return;
  fetch(link.href).then(r => r.json()).then(m => {
    const base = new URL(m.start_url || './index.html', location.href);
    const target = base.pathname + location.search;
    m.start_url = target;
    const blob = new Blob([JSON.stringify(m)], { type: 'application/manifest+json' });
    link.href = URL.createObjectURL(blob);
  }).catch(() => {});
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
